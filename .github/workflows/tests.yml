name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
            client/requirements.txt
      - name: Install test dependency
        run: python -m pip install --upgrade pip -r server/requirements.txt -r client/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q accounting_app db manager ui server client main.py config.py
