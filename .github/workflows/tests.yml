name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
            client/requirements.txt
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0
      - name: Install test dependency
        run: python -m pip install --upgrade pip -r requirements.txt -r server/requirements.txt -r client/requirements.txt
      - name: Import Qt 6 UI modules (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import PySide6; import ui.pages.auth_page; import ui.pages.dashboard; import ui.pages.installer_wizard; import ui.pages.main_window; import ui.panels.report_panel; import ui.panels.sell_panel; import ui.widgets.menu_bar; import client.desktop; print('PySide6 UI imports OK', PySide6.__version__)"
      - name: Instantiate Qt 6 widgets (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from ui.pages.auth_page import AuthPage
          from ui.pages.installer_wizard import InitialSetupWizard
          from ui.widgets.calculator_dialog import Calculator
          from ui.widgets.password_line_edit import PasswordLineEdit

          app = QApplication([])
          widgets = [AuthPage(), InitialSetupWizard(), Calculator(), PasswordLineEdit()]
          for widget in widgets:
              widget.close()
          app.processEvents()
          print("PySide6 widget construction OK")
          PY
      - name: Reject legacy Qt 5 imports and APIs
        run: |
          if grep -R -n -E 'PySide2|exec_' --include='*.py' ui client main.py; then
            echo "Legacy Qt 5 imports/API remain."
            exit 1
          fi
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q accounting_app db manager ui server client main.py config.py
