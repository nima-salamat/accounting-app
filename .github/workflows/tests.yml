name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
            client/requirements.txt
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0
      - name: Install test dependency
        run: python -m pip install --upgrade pip -r requirements.txt -r server/requirements.txt -r client/requirements.txt
      - name: Import the API-backed client UI (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import PySide6; import client.desktop; import client.ui.auth_page; import client.ui.setup_wizard; import client.ui.main_window; import client.ui.dashboard_page; import client.ui.data_pages; import client.ui.admin_pages; import client.ui.sales_page; import client.ui.settings_page; import client.ui.purchasing_page; import client.ui.invoice_templates_page; import client.ui.touch_keyboard; import client.kiosk; print('API-backed PySide6 UI imports OK', PySide6.__version__)"
      - name: Instantiate client widgets (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from client.api_client import AccountingApiClient
          from client.ui.forms import RecordDialog
          from client.ui.setup_wizard import SetupWizard

          app = QApplication([])
          api = AccountingApiClient("http://127.0.0.1:8000")
          wizard = SetupWizard(api, mode="dark")
          dialog = RecordDialog("Test form", [{"key": "name", "label": "Name", "required": True}])
          assert wizard.pages.count() == 3
          dialog.inputs["name"].setText("Smoke test")
          assert dialog.values() == {"name": "Smoke test"}
          wizard.close()
          dialog.close()
          app.processEvents()
          print("New client widget construction OK")
          PY
      - name: Reject legacy Qt 5 imports and APIs
        run: |
          if grep -R -n -E 'PySide2|exec_' --include='*.py' ui client main.py; then
            echo "Legacy Qt 5 imports/API remain."
            exit 1
          fi
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q accounting_app db manager ui server client main.py config.py
